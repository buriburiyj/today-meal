<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <title>오늘급식</title>
  <link rel="manifest"
    href='data:application/json,{"name":"오늘급식","short_name":"오늘급식","start_url":".","display":"standalone","background_color":"%234f46e5","theme_color":"%234f46e5","icons":[{"src":"data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><rect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%234f46e5%27/><text x=%2750%27 y=%2772%27 font-size=%2762%27 text-anchor=%27middle%27>🍚</text></svg>","sizes":"any","type":"image/svg+xml"}]}'>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      color: #1e293b;
      transition: background 1.2s ease;
    }

    body.dawn {
      background: linear-gradient(180deg, #fca5a5 0%, #fdba74 40%, #fef3c7 100%);
    }

    body.day {
      background: linear-gradient(180deg, #60a5fa 0%, #93c5fd 45%, #e0f2fe 100%);
    }

    body.eve {
      background: linear-gradient(180deg, #7c3aed 0%, #a78bfa 45%, #fbcfe8 100%);
    }

    body.night {
      background: linear-gradient(180deg, #1e293b 0%, #334155 50%, #475569 100%);
    }

    .wrap {
      max-width: 500px;
      margin: 0 auto;
      padding: 24px 18px 48px;
      min-height: 100vh;
    }

    .top {
      text-align: center;
      color: #fff;
      padding: 8px 0 18px;
      text-shadow: 0 1px 8px rgba(0, 0, 0, .15);
    }

    .top .app-name {
      font-size: 15px;
      font-weight: 700;
      opacity: .9;
    }

    .top .greet {
      font-size: 22px;
      font-weight: 800;
      margin-top: 6px;
    }

    .top .date {
      font-size: 13px;
      opacity: .85;
      margin-top: 4px;
    }

    .glass {
      background: rgba(255, 255, 255, .72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, .10);
      border: 1px solid rgba(255, 255, 255, .5);
    }

    .card-title {
      font-weight: 800;
      font-size: 14px;
      color: #4f46e5;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hero {
      text-align: center;
      color: #fff;
      padding: 4px 0 10px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .2);
    }

    .hero .loc {
      font-size: 14px;
      opacity: .9;
    }

    .hero .big {
      font-size: 74px;
      font-weight: 800;
      line-height: 1;
      margin: 4px 0;
    }

    .hero .desc {
      font-size: 16px;
      opacity: .95;
    }

    .hero .mm {
      font-size: 13px;
      opacity: .85;
      margin-top: 4px;
    }

    .hero .compare {
      font-size: 13px;
      opacity: .9;
      margin-top: 6px;
      background: rgba(255, 255, 255, .2);
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .hero-extra {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .chip {
      background: rgba(255, 255, 255, .22);
      color: #fff;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    .hourly-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 4px;
      padding: 4px 2px 8px;
    }

    .hourly-scroll::-webkit-scrollbar {
      height: 0;
    }

    .hour-cell {
      flex: 0 0 auto;
      text-align: center;
      background: rgba(255, 255, 255, .6);
      border-radius: 16px;
      padding: 12px 14px;
      min-width: 60px;
    }

    .hour-cell .h {
      font-size: 12px;
      color: #64748b;
    }

    .hour-cell .e {
      font-size: 22px;
      margin: 4px 0;
    }

    .hour-cell .t {
      font-size: 15px;
      font-weight: 800;
      color: #1e293b;
    }

    .air-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }

    .air-badge {
      flex: 0 0 auto;
      border-radius: 16px;
      padding: 14px 20px;
      color: #fff;
      text-align: center;
      min-width: 140px;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
    }

    .air-badge .name {
      font-size: 12px;
      opacity: .9;
    }

    .air-badge .lv {
      font-size: 20px;
      font-weight: 800;
      margin: 4px 0;
    }

    .air-badge .val {
      font-size: 12px;
      opacity: .9;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      font-size: 16px;
      margin-bottom: 10px;
      background: #fff;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #4f46e5;
    }

    button {
      width: 100%;
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    .school-item {
      padding: 14px;
      border-top: 1px solid #f1f5f9;
      cursor: pointer;
      border-radius: 10px;
    }

    .school-item:active {
      background: #f1f5f9;
    }

    .school-item small {
      color: #94a3b8;
      display: block;
      margin-top: 3px;
      font-size: 13px;
    }

    .meal,
    .timetable {
      line-height: 2.1;
      white-space: pre-line;
      font-size: 15px;
      color: #334155;
    }

    .info {
      color: #94a3b8;
      font-size: 14px;
      text-align: center;
      padding: 16px;
      line-height: 1.6;
    }

    .mmeal {
      font-weight: 700;
      color: #1e293b;
    }

    .cur-school {
      font-weight: 800;
      font-size: 18px;
    }

    .cur-school .change {
      float: right;
      font-size: 12px;
      color: #4f46e5;
      background: #eef2ff;
      padding: 5px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .gc-row {
      display: flex;
      gap: 10px;
    }

    .gc-row select {
      flex: 1;
    }

    .subscribe-box {
      background: rgba(238, 242, 255, .85);
      border-radius: 16px;
      padding: 16px;
      margin-top: 4px;
    }

    .subscribe-box .label {
      font-weight: 800;
      color: #4f46e5;
      margin-bottom: 8px;
      font-size: 15px;
    }

    .subscribe-box .desc {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .msg {
      text-align: center;
      font-size: 14px;
      margin-top: 10px;
      font-weight: 600;
    }

    .academy-box {
      background: rgba(255, 247, 237, .9);
      border-radius: 16px;
      padding: 16px;
      margin-top: 14px;
    }

    .academy-box .label {
      font-weight: 800;
      color: #ea580c;
      margin-bottom: 8px;
      font-size: 15px;
    }

    .academy-box .desc {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .day-row {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }

    .day-btn {
      flex: 1;
      padding: 10px 0;
      border: 1px solid #fed7aa;
      background: #fff;
      color: #9a3412;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .day-btn.on {
      background: #ea580c;
      color: #fff;
      border-color: #ea580c;
    }

    .academy-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }

    .academy-item .aname {
      font-weight: 700;
    }

    .academy-item .ainfo {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .adel {
      background: #fecaca;
      color: #b91c1c;
      width: auto;
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 8px;
    }

    .btn-add {
      background: #ea580c;
      margin-bottom: 10px;
    }

    .btn-save {
      background: #16a34a;
    }

    .dday-box {
      background: rgba(237, 233, 254, .9);
      border-radius: 16px;
      padding: 16px;
      margin-top: 14px;
    }

    .dday-box .label {
      font-weight: 800;
      color: #7c3aed;
      margin-bottom: 8px;
      font-size: 15px;
    }

    .dday-box .desc {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .btn-add-dd {
      background: #7c3aed;
      margin-bottom: 10px;
    }

    .dd-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }

    .dd-item .ddname {
      font-weight: 700;
    }

    .dd-item .ddinfo {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .dd-item .ddlabel {
      font-weight: 800;
      color: #7c3aed;
      margin-right: 10px;
    }

    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: sk 1.4s infinite;
      border-radius: 12px;
      height: 80px;
    }

    @keyframes sk {
      0% {
        background-position: 200% 0
      }

      100% {
        background-position: -200% 0
      }
    }
  </style>
</head>

<body class="day">
  <div class="wrap">

    <div class="top">
      <div class="app-name">🍚 오늘급식</div>
      <div class="greet" id="greet">좋은 하루예요!</div>
      <div class="date" id="topDate"></div>
    </div>

    <div id="heroWeather"></div>

    <div class="glass" id="airCard" style="display:none">
      <div class="card-title">🌫️ 미세먼지</div>
      <div id="airContent"></div>
    </div>

    <div class="glass" id="searchCard">
      <div class="card-title">🏫 우리 학교 찾기</div>
      <input id="q" placeholder="학교 이름 검색 (예: 불로초)" onkeydown="if(event.key==='Enter')searchSchool()">
      <button onclick="searchSchool()">학교 검색</button>
      <div id="schoolList"></div>
    </div>

    <div id="schoolView" style="display:none">
      <div class="glass">
        <div class="cur-school"><span id="curSchoolName"></span><span class="change" onclick="changeSchool()">학교
            변경</span></div>
        <div style="margin-top:14px">
          <div class="card-title" style="margin-bottom:8px">🎓 학년 · 반 선택</div>
          <div class="gc-row">
            <select id="gradeSel" onchange="onGradeClassChange()"></select>
            <select id="classSel" onchange="onGradeClassChange()"></select>
          </div>
        </div>
      </div>
      <div class="glass">
        <div class="card-title">🍚 오늘 급식</div>
        <div class="meal" id="mealContent"></div>
      </div>
      <div class="glass">
        <div class="card-title">📅 오늘 시간표</div>
        <div class="timetable" id="timetableContent"></div>
      </div>
      <div class="glass">
        <div class="subscribe-box">
          <div class="label">📬 매일 아침 메일로 받기</div>
          <div class="desc">이메일을 넣으면 매일 아침 7시에 급식·날씨·시간표를 보내드려요. (학년·반을 먼저 골라주세요)</div>
          <input id="emailInput" type="email" placeholder="이메일 주소 입력">
          <button onclick="subscribe()">구독하기</button>
          <div class="msg" id="subMsg"></div>
        </div>
        <div class="academy-box">
          <div class="label">🎒 내 학원 일정</div>
          <div class="desc">먼저 구독하고, 학원을 추가하면 매일 아침 메일에 그날 학원이 나와요.</div>
          <input id="acName" placeholder="학원 이름 (예: 수학학원)">
          <div class="day-row" id="dayRow"></div>
          <input id="acTime" type="time">
          <button class="btn-add" onclick="addAcademy()">+ 학원 추가</button>
          <div id="acList"></div>
          <button class="btn-save" onclick="saveAcademy()">학원 일정 저장</button>
          <div class="msg" id="acMsg"></div>
        </div>
        <div class="dday-box">
          <div class="label">🎯 디데이 (D-Day)</div>
          <div class="desc">여름방학·시험처럼 기다리는 날을 넣으면 매일 며칠 남았는지 세어주고, 아침 메일에도 나와요.</div>
          <input id="ddName" placeholder="이름 (예: 여름방학)">
          <input id="ddDate" type="date">
          <button class="btn-add-dd" onclick="addDday()">+ 디데이 추가</button>
          <div id="ddList"></div>
          <button class="btn-save" onclick="saveDday()">디데이 저장</button>
          <div class="msg" id="ddMsg"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const WORKER_URL = "https://gitupsik-mail.buriburiyejun.workers.dev";

    let currentSchool = null, academies = [], selectedDays = [], ddays = [];
    let myLat = null, myLon = null;
    let grade = null, classNm = null;
    const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];

    function applyTimeTheme() {
      const h = new Date().getHours(), body = document.body;
      body.className = '';
      let greet, theme;
      if (h >= 5 && h < 9) { theme = 'dawn'; greet = '좋은 아침이에요! 🌅'; }
      else if (h >= 9 && h < 17) { theme = 'day'; greet = '활기찬 하루예요! ☀️'; }
      else if (h >= 17 && h < 20) { theme = 'eve'; greet = '좋은 저녁이에요 🌆'; }
      else { theme = 'night'; greet = '편안한 밤 되세요 🌙'; }
      body.classList.add(theme);
      document.getElementById('greet').textContent = greet;
    }
    function todayKorean() { const d = new Date(); const days = ['일', '월', '화', '수', '목', '금', '토']; return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`; }
    function weatherDesc(c) { if (c === 0) return "맑음"; if (c <= 2) return "구름 조금"; if (c === 3) return "흐림"; if (c <= 48) return "안개"; if (c <= 67) return "비"; if (c <= 77) return "눈"; if (c <= 82) return "소나기"; return "궂은 날씨"; }
    function weatherEmoji(c) { if (c === 0) return "☀️"; if (c <= 2) return "🌤️"; if (c === 3) return "☁️"; if (c <= 48) return "🌫️"; if (c <= 67) return "🌧️"; if (c <= 77) return "❄️"; if (c <= 82) return "🌦️"; return "🌩️"; }
    function getOutfit(t) { if (t >= 28) return "👕 반팔·반바지"; if (t >= 23) return "👕 반팔"; if (t >= 20) return "👔 얇은 긴팔"; if (t >= 17) return "🧥 니트·맨투맨"; if (t >= 12) return "🧥 자켓·가디건"; if (t >= 9) return "🧥 트렌치·야상"; if (t >= 5) return "🧥 코트·히트텍"; return "🧥 패딩·목도리"; }
    function airLevel(v, [g, n, b]) { if (v <= g) return { label: "좋음", color: "#3b82f6", emoji: "😊" }; if (v <= n) return { label: "보통", color: "#22c55e", emoji: "🙂" }; if (v <= b) return { label: "나쁨", color: "#f59e0b", emoji: "😷" }; return { label: "매우나쁨", color: "#ef4444", emoji: "🤢" }; }

    function loadMyLocationWeather() {
      const hero = document.getElementById('heroWeather');
      hero.innerHTML = `<div class="glass"><div class="skeleton"></div></div>`;
      if (!navigator.geolocation) { hero.innerHTML = `<div class="glass"><div class="info">이 브라우저는 위치를 지원하지 않아요.</div></div>`; return; }
      navigator.geolocation.getCurrentPosition(
        pos => renderWeather(pos.coords.latitude, pos.coords.longitude, '내 위치'),
        err => { hero.innerHTML = `<div class="glass"><div class="info">📍 위치를 허용하면 지금 날씨를 볼 수 있어요.<br><button style="margin-top:10px;width:auto;padding:8px 16px" onclick="loadMyLocationWeather()">위치 다시 시도</button></div></div>`; }
      );
    }

    async function renderWeather(lat, lon, locName) {
      myLat = lat; myLon = lon;
      const hero = document.getElementById('heroWeather');
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&past_days=1&forecast_days=2`;
        const res = await fetch(url); const d = await res.json();
        const cur = d.current, day = d.daily;
        const tMax = Math.round(day.temperature_2m_max[1]), tMin = Math.round(day.temperature_2m_min[1]), yMax = Math.round(day.temperature_2m_max[0]);
        const rainProb = day.precipitation_probability_max[1];
        const diff = tMax - yMax;
        let compare = diff >= 3 ? `어제보다 ${diff}° 따뜻 🌡️` : diff <= -3 ? `어제보다 ${Math.abs(diff)}° 추움 🧊` : '어제랑 비슷해요';
        const nowH = new Date();
        const nowKey = `${nowH.getFullYear()}-${String(nowH.getMonth() + 1).padStart(2, '0')}-${String(nowH.getDate()).padStart(2, '0')}T${String(nowH.getHours()).padStart(2, '0')}:00`;
        let si = d.hourly.time.findIndex(t => t >= nowKey); if (si < 0) si = 0;
        let cells = '';
        for (let i = si; i < si + 15 && i < d.hourly.time.length; i++) {
          const h = parseInt(d.hourly.time[i].slice(11, 13));
          cells += `<div class="hour-cell"><div class="h">${h}시</div><div class="e">${weatherEmoji(d.hourly.weather_code[i])}</div><div class="t">${Math.round(d.hourly.temperature_2m[i])}°</div></div>`;
        }
        hero.innerHTML = `
      <div class="hero">
        <div class="loc">📍 ${locName}</div>
        <div class="big">${Math.round(cur.temperature_2m)}°</div>
        <div class="desc">${weatherEmoji(cur.weather_code)} ${weatherDesc(cur.weather_code)}</div>
        <div class="mm">최고 ${tMax}° / 최저 ${tMin}°</div>
        <div class="compare">${compare}</div>
        <div class="hero-extra"><span class="chip">☔ 강수 ${rainProb}%</span><span class="chip">${getOutfit(tMax)}</span></div>
      </div>
      <div class="glass" style="margin-top:14px">
        <div class="card-title">🕐 시간별 날씨</div>
        <div class="hourly-scroll">${cells}</div>
      </div>`;
        loadAir(lat, lon);
      } catch (e) { hero.innerHTML = `<div class="glass"><div class="info">날씨를 못 불러왔어.</div></div>`; }
    }

    async function loadAir(lat, lon) {
      const card = document.getElementById('airCard'), el = document.getElementById('airContent');
      card.style.display = 'block';
      el.innerHTML = '<div class="skeleton" style="height:60px"></div>';
      try {
        const res = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=pm10,pm2_5&timezone=Asia%2FSeoul`);
        const d = await res.json();
        const pm10 = Math.round(d.current.pm10), pm25 = Math.round(d.current.pm2_5);
        const i10 = airLevel(pm10, [30, 80, 150]), i25 = airLevel(pm25, [15, 35, 75]);
        const badge = (n, v, i) => `<div class="air-badge" style="background:${i.color}"><div class="name">${n}</div><div class="lv">${i.emoji} ${i.label}</div><div class="val">${v} ㎍/㎥</div></div>`;
        el.innerHTML = `<div class="air-scroll">${badge('미세먼지 PM10', pm10, i10)}${badge('초미세먼지 PM2.5', pm25, i25)}</div>`;
      } catch (e) { el.innerHTML = '<div class="info">미세먼지를 못 불러왔어.</div>'; }
    }

    async function searchSchool() {
      const name = document.getElementById('q').value.trim();
      if (!name) { alert('학교 이름을 입력해줘!'); return; }
      const listEl = document.getElementById('schoolList');
      listEl.innerHTML = '<div class="info">검색 중...</div>';
      try {
        const res = await fetch(`${WORKER_URL}/api/school?name=${encodeURIComponent(name)}`);
        const data = await res.json();
        if (!data.ok || !data.schools || !data.schools.length) { listEl.innerHTML = '<div class="info">검색 결과가 없어.</div>'; return; }
        window._rows = data.schools;
        listEl.innerHTML = data.schools.map((s, i) => `<div class="school-item" onclick="selectSchool(${i})">${s.schoolName}<small>${s.address || ''}</small></div>`).join('');
      } catch (e) { listEl.innerHTML = '<div class="info">오류가 났어.</div>'; }
    }

    function selectSchool(i) {
      const s = window._rows[i];
      currentSchool = { officeCode: s.officeCode, schoolCode: s.schoolCode, schoolName: s.schoolName };
      localStorage.setItem('mySchool', JSON.stringify(currentSchool));
      grade = null; classNm = null;
      showSchool();
    }

    function buildGradeClassSelectors() {
      const gs = document.getElementById('gradeSel'), cs = document.getElementById('classSel');
      let go = '<option value="">학년</option>';
      for (let g = 1; g <= 6; g++) go += `<option value="${g}" ${grade == g ? 'selected' : ''}>${g}학년</option>`;
      gs.innerHTML = go;
      let co = '<option value="">반</option>';
      for (let c = 1; c <= 15; c++) co += `<option value="${c}" ${classNm == c ? 'selected' : ''}>${c}반</option>`;
      cs.innerHTML = co;
    }

    function onGradeClassChange() {
      grade = document.getElementById('gradeSel').value || null;
      classNm = document.getElementById('classSel').value || null;
      if (currentSchool) {
        localStorage.setItem('myGrade', grade || '');
        localStorage.setItem('myClass', classNm || '');
      }
      loadTimetable();
    }

    function showSchool() {
      document.getElementById('searchCard').style.display = 'none';
      document.getElementById('schoolView').style.display = 'block';
      document.getElementById('curSchoolName').textContent = currentSchool.schoolName;
      document.getElementById('subMsg').textContent = '';
      document.getElementById('acMsg').textContent = '';
      document.getElementById('ddMsg').textContent = '';
      academies = []; selectedDays = []; ddays = [];
      buildGradeClassSelectors();
      renderDayButtons(); renderAcademyList(); renderDdayList();
      loadMeal(); loadTimetable();
    }

    function changeSchool() {
      localStorage.removeItem('mySchool');
      localStorage.removeItem('myGrade');
      localStorage.removeItem('myClass');
      currentSchool = null; grade = null; classNm = null;
      document.getElementById('schoolView').style.display = 'none';
      document.getElementById('searchCard').style.display = 'block';
      document.getElementById('q').value = '';
      document.getElementById('schoolList').innerHTML = '';
    }

    async function loadMeal() {
      const el = document.getElementById('mealContent');
      el.innerHTML = '<div class="info">불러오는 중...</div>';
      try {
        const res = await fetch(`${WORKER_URL}/api/meal?office=${currentSchool.officeCode}&school=${currentSchool.schoolCode}`);
        const data = await res.json();
        if (!data.ok || !data.meal) { el.innerHTML = '<span class="info">오늘은 급식 정보가 없어.</span>'; return; }
        el.innerHTML = data.meal.replace(/<br><br>/g, '\n\n').replace(/<br>/g, '\n').replace(/<b>(.*?)<\/b>/g, '<span class="mmeal">$1</span>');
      } catch (e) { el.textContent = '급식을 못 불러왔어.'; }
    }

    async function loadTimetable() {
      const el = document.getElementById('timetableContent');
      if (!grade || !classNm) { el.innerHTML = '<span class="info">학년·반을 선택하면 시간표가 나와요.</span>'; return; }
      el.innerHTML = '<div class="info">불러오는 중...</div>';
      try {
        const res = await fetch(`${WORKER_URL}/api/timetable?office=${currentSchool.officeCode}&school=${currentSchool.schoolCode}&grade=${grade}&class=${classNm}`);
        const data = await res.json();
        if (data.ok && data.timetable) { el.innerHTML = data.timetable.replace(/<br>/g, '\n'); return; }
      } catch (e) { }
      el.innerHTML = '<span class="info">오늘 시간표 정보가 없어.</span>';
    }

    async function subscribe() {
      const email = document.getElementById('emailInput').value.trim();
      const msg = document.getElementById('subMsg');
      if (!email || !email.includes('@')) { msg.style.color = '#ef4444'; msg.textContent = '이메일을 제대로 입력해줘!'; return; }
      if (!myLat || !myLon) { msg.style.color = '#ef4444'; msg.textContent = '📍 위치를 먼저 허용해줘! (날씨를 넣으려면 필요해)'; return; }
      if (!grade || !classNm) { msg.style.color = '#ef4444'; msg.textContent = '🎓 학년·반을 먼저 골라줘!'; return; }
      msg.style.color = '#64748b'; msg.textContent = '구독 처리 중...';
      try {
        const res = await fetch(`${WORKER_URL}/subscribe`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, ...currentSchool, lat: myLat, lon: myLon, grade, classNm })
        });
        const data = await res.json();
        if (data.ok) { msg.style.color = '#16a34a'; msg.textContent = '✅ ' + data.msg; localStorage.setItem('myEmail', email); loadAcademies(email); loadDdays(email); }
        else { msg.style.color = '#ef4444'; msg.textContent = '❌ ' + data.msg; }
      } catch (e) { msg.style.color = '#ef4444'; msg.textContent = '❌ 오류가 났어. 다시 시도해봐.'; }
    }

    function renderDayButtons() {
      document.getElementById('dayRow').innerHTML = DAY_NAMES.map((d, i) => `<div class="day-btn ${selectedDays.includes(i) ? 'on' : ''}" onclick="toggleDay(${i})">${d}</div>`).join('');
    }
    function toggleDay(i) {
      if (selectedDays.includes(i)) selectedDays = selectedDays.filter(x => x !== i);
      else selectedDays.push(i);
      renderDayButtons();
    }
    function addAcademy() {
      const name = document.getElementById('acName').value.trim();
      const time = document.getElementById('acTime').value;
      const msg = document.getElementById('acMsg');
      if (!name) { msg.style.color = '#ef4444'; msg.textContent = '학원 이름을 입력해줘!'; return; }
      if (!selectedDays.length) { msg.style.color = '#ef4444'; msg.textContent = '요일을 하나 이상 골라줘!'; return; }
      academies.push({ name, days: [...selectedDays].sort(), time });
      document.getElementById('acName').value = ''; document.getElementById('acTime').value = '';
      selectedDays = []; renderDayButtons(); renderAcademyList(); msg.textContent = '';
    }
    function removeAcademy(i) { academies.splice(i, 1); renderAcademyList(); }
    function renderAcademyList() {
      const el = document.getElementById('acList');
      if (!academies.length) { el.innerHTML = '<div class="info" style="padding:8px">아직 추가한 학원이 없어.</div>'; return; }
      el.innerHTML = academies.map((a, i) => {
        const dayStr = a.days.map(d => DAY_NAMES[d]).join('·');
        return `<div class="academy-item"><div><div class="aname">${a.name}</div><div class="ainfo">${dayStr}요일 ${a.time || ''}</div></div><button class="adel" onclick="removeAcademy(${i})">삭제</button></div>`;
      }).join('');
    }
    async function loadAcademies(email) {
      try {
        const res = await fetch(`${WORKER_URL}/getacademy?email=${encodeURIComponent(email)}`);
        const data = await res.json();
        if (data.ok && data.academies) { academies = data.academies; renderAcademyList(); }
      } catch (e) { }
    }
    async function saveAcademy() {
      const email = document.getElementById('emailInput').value.trim();
      const msg = document.getElementById('acMsg');
      if (!email || !email.includes('@')) { msg.style.color = '#ef4444'; msg.textContent = '먼저 위에서 이메일 넣고 구독해줘!'; return; }
      msg.style.color = '#64748b'; msg.textContent = '저장 중...';
      try {
        const res = await fetch(`${WORKER_URL}/setacademy`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, academies })
        });
        const data = await res.json();
        if (data.ok) { msg.style.color = '#16a34a'; msg.textContent = '✅ ' + data.msg; }
        else { msg.style.color = '#ef4444'; msg.textContent = '❌ ' + data.msg; }
      } catch (e) { msg.style.color = '#ef4444'; msg.textContent = '❌ 오류가 났어.'; }
    }

    function ddayDiff(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const target = new Date(y, m - 1, d);
      const now = new Date();
      const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((target - today0) / 86400000);
    }
    function addDday() {
      const name = document.getElementById('ddName').value.trim();
      const date = document.getElementById('ddDate').value;
      const msg = document.getElementById('ddMsg');
      if (!name) { msg.style.color = '#ef4444'; msg.textContent = '이름을 입력해줘! (예: 여름방학)'; return; }
      if (!date) { msg.style.color = '#ef4444'; msg.textContent = '날짜를 골라줘!'; return; }
      ddays.push({ name, date });
      document.getElementById('ddName').value = ''; document.getElementById('ddDate').value = '';
      renderDdayList(); msg.textContent = '';
    }
    function removeDday(i) { ddays.splice(i, 1); renderDdayList(); }
    function renderDdayList() {
      const el = document.getElementById('ddList');
      if (!ddays.length) { el.innerHTML = '<div class="info" style="padding:8px">아직 추가한 디데이가 없어.</div>'; return; }
      const sorted = [...ddays].map((d, i) => ({ ...d, i, diff: ddayDiff(d.date) })).sort((a, b) => a.diff - b.diff);
      el.innerHTML = sorted.map(d => {
        const label = d.diff === 0 ? 'D-DAY 🎉' : d.diff > 0 ? `D-${d.diff}` : `D+${Math.abs(d.diff)}`;
        return `<div class="dd-item"><div><div class="ddname">${d.name}</div><div class="ddinfo">${d.date}</div></div><div style="display:flex;align-items:center"><span class="ddlabel">${label}</span><button class="adel" onclick="removeDday(${d.i})">삭제</button></div></div>`;
      }).join('');
    }
    async function loadDdays(email) {
      try {
        const res = await fetch(`${WORKER_URL}/getdday?email=${encodeURIComponent(email)}`);
        const data = await res.json();
        if (data.ok && data.ddays) { ddays = data.ddays; renderDdayList(); }
      } catch (e) { }
    }
    async function saveDday() {
      const email = document.getElementById('emailInput').value.trim();
      const msg = document.getElementById('ddMsg');
      if (!email || !email.includes('@')) { msg.style.color = '#ef4444'; msg.textContent = '먼저 위에서 이메일 넣고 구독해줘!'; return; }
      msg.style.color = '#64748b'; msg.textContent = '저장 중...';
      try {
        const res = await fetch(`${WORKER_URL}/setdday`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, ddays })
        });
        const data = await res.json();
        if (data.ok) { msg.style.color = '#16a34a'; msg.textContent = '✅ ' + data.msg; }
        else { msg.style.color = '#ef4444'; msg.textContent = '❌ ' + data.msg; }
      } catch (e) { msg.style.color = '#ef4444'; msg.textContent = '❌ 오류가 났어.'; }
    }

    window.addEventListener('load', () => {
      applyTimeTheme();
      document.getElementById('topDate').textContent = todayKorean();
      loadMyLocationWeather();
      const saved = localStorage.getItem('mySchool');
      if (saved) {
        try {
          currentSchool = JSON.parse(saved);
          grade = localStorage.getItem('myGrade') || null;
          classNm = localStorage.getItem('myClass') || null;
          showSchool();
        } catch (e) { }
      }
      const savedEmail = localStorage.getItem('myEmail');
      if (savedEmail) {
        document.getElementById('emailInput').value = savedEmail;
        loadAcademies(savedEmail);
        loadDdays(savedEmail);
      }
    });
  </script>
</body>

</html>
