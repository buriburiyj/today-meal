<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>월간 달력 · 오늘급식</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    .cal-wrap { max-width: 480px; margin: 0 auto; padding: 14px; }
    .cal-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
    .cal-head button { width:auto; padding:8px 14px; }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
    .cal-dow { text-align:center; font-size:12px; color:#64748b; padding:4px 0; font-weight:700; }
    .cal-cell { aspect-ratio:1; border-radius:10px; background:#fff; border:1px solid #e2e8f0;
                display:flex; flex-direction:column; align-items:center; justify-content:center;
                cursor:pointer; font-size:14px; position:relative; }
    .cal-cell.empty { background:transparent; border:none; cursor:default; }
    .cal-cell.today { border:2px solid #4f46e5; font-weight:800; }
    .cal-cell.sel { background:#4f46e5; color:#fff; }
    .cal-cell.holiday { color:#ef4444; }
    .dots { display:flex; gap:2px; margin-top:3px; height:6px; }
    .dot { width:5px; height:5px; border-radius:50%; }
    .dot.ev { background:#f97316; }
    .dot.meal { background:#16a34a; }
    .dot.ac { background:#3b82f6; }
    .dot.dd { background:#a855f7; }
    .cal-detail { margin-top:14px; }
    .det-sec { background:#fff; border-radius:12px; padding:12px; margin-bottom:8px; }
    .det-sec .t { font-weight:800; color:#4f46e5; font-size:14px; margin-bottom:6px; }
    .det-sec .b { color:#334155; font-size:14px; line-height:1.7; white-space:pre-line; }
    details.det-sec summary { font-weight:800; color:#4f46e5; font-size:14px; cursor:pointer; }
    .legend { display:flex; gap:10px; flex-wrap:wrap; font-size:11px; color:#64748b; margin:8px 0 4px; }
    .legend span { display:flex; align-items:center; gap:3px; }
    /* 가독성: 숫자를 크게, 어두운 배경에서도 보이게 */
    .cal-cell { font-size:17px; font-weight:700; color:#1e293b; }
    .cal-cell.sel { color:#fff; }
    .cal-dow { font-size:13px; color:#e2e8f0; }
    .cal-wrap .msg { color:#e2e8f0; font-size:14px; }
    .legend { color:#cbd5e1; font-size:12px; }
    #monthLabel { color:#f8fafc; }
    .cal-detail > div:first-child { color:#f8fafc; }
    .det-sec .b { color:#334155; }
    .cal-cell.holiday { color:#dc2626; }
    .cal-cell.today { border:2px solid #4f46e5; box-shadow:0 0 0 2px rgba(79,70,229,.25); }
  </style>
</head>
<body class="day">
  <div class="cal-wrap">
    <div class="cal-head">
      <button onclick="shiftMonth(-1)">◀</button>
      <div style="font-weight:800;font-size:17px" id="monthLabel"></div>
      <button onclick="shiftMonth(1)">▶</button>
    </div>
    <div style="text-align:center;margin-bottom:10px">
      <button onclick="location.href='/'" style="width:auto;padding:7px 14px">🏠 오늘 화면</button>
      <button onclick="goThisMonth()" style="width:auto;padding:7px 14px">이번 달</button>
    </div>
    <div class="legend">
      <span><i class="dot ev"></i> 학교일정</span>
      <span><i class="dot meal"></i> 급식</span>
      <span><i class="dot ac"></i> 학원</span>
      <span><i class="dot dd"></i> 디데이</span>
    </div>
    <div class="cal-grid" id="dowRow"></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="msg" id="calMsg"></div>
    <div class="cal-detail" id="calDetail"></div>
  </div>
  <script src="script.js"></script>
  <script src="calendar.js"></script>
</body>
</html>
